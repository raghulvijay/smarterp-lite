<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — SmartERP Lite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f8fafc; color: #1e293b;
      padding: 20px;
    }
    .card {
      max-width: 460px; width: 100%;
      background: white; border-radius: 16px;
      padding: 40px; text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon {
      width: 64px; height: 64px; border-radius: 16px;
      background: #f1f5f9; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 20px; font-size: 28px;
    }
    h1 { font-size: 1.375rem; font-weight: 700; margin-bottom: 12px; }
    p { color: #64748b; font-size: 0.9375rem; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #4f46e5; color: white; border: none;
      border-radius: 8px; padding: 10px 24px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>SmartERP Lite needs an internet connection for live data. Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
